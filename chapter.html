<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>本地小說企劃展示與整理臺 ver1.4 · 篇章管理</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme-manager.css" />
    <link rel="stylesheet" href="css/browse.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap topin">
        <div class="brand">
          <div class="mark">文</div>
          <div>本地小說企劃展示與整理臺 ver1.4 · 篇章管理</div>
        </div>
        <nav class="nav">
          <a href="index.html">← 返回書架</a><a href="timeline.html">時間線</a
          ><a id="imagesLink" href="images.html">本篇圖片</a
          ><button class="btn" id="editChapterBtn">編輯篇章</button
          ><button
            class="btn"
            id="reconnectBtn"
            onclick="BY.reconnect()"
            hidden
          >
            恢復上次項目</button
          ><button class="btn" onclick="BY.connect()">重選項目</button>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <div class="crumb">書架 / 篇章 / 檔案管理</div>
      <section class="hero">
        <div class="eyebrow" id="chapterTheme">篇章</div>
        <h1 id="chapterTitle">讀取中…</h1>
        <div class="lead" id="chapterSub"></div>
        <div class="notice" style="margin-top: 12px">
          狀態：<span id="projectStatus">讀取中…</span>
        </div>
      </section>
      <section class="section">
        <div class="sectionhead">
          <h2>檔案與子資料夾</h2>
          <div class="meta">這裡操作的是硬碟中的真實檔案；刪除會二次確認。</div>
        </div>
        <div id="docList"><div class="empty">正在讀取…</div></div>
      </section>
      <p class="wrap" style="opacity: 0.65; padding: 20px 0">
        程式碼 MIT · 教學 CC BY 4.0 · AI 素材另見聲明 · ver1.4
      </p>
    </main>
    <div class="dialog" id="chapterSettingsDialog">
      <div class="dialogbox">
        <h2>編輯篇章</h2>
        <div class="field">
          <label>篇章名稱</label><input id="editChapterTitle" />
        </div>
        <div class="field">
          <label>副標題</label
          ><input id="editChapterSubtitle" placeholder="例如：系列第一部" />
        </div>
        <div class="field">
          <label>簡介</label
          ><textarea id="editChapterDescription" rows="3"></textarea>
        </div>
        <div class="field">
          <label>篇章類型</label
          ><select id="editChapterTheme"></select>
        </div>
        <div class="hint">
          需要新增或修改類型時，使用右下角「🎨 主題」。英文 ID
          與資料夾位置不會在這裡改動。
        </div>
        <div class="actions">
          <button class="btn" onclick="BY.saveChapterSettings()">
            保存修改</button
          ><button class="btn" onclick="BY.closeChapterSettings()">取消</button>
        </div>
      </div>
    </div>
    <script src="js/marked.js"></script>
    <script src="js/jszip.min.js"></script>
    <script src="js/docx-import.js"></script>
    <script src="js/markdown-utils.js"></script>
    <script src="js/reader-navigation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/workbench.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/browse.js"></script>
    <script>
      BY.initChapter();
    </script>
  </body>
</html>
