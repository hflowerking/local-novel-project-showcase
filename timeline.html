<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>本地小說企劃展示與整理臺 ver1.4 · 時間線</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme-manager.css" />
    <link rel="stylesheet" href="css/browse.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap topin">
        <div class="brand"><div class="mark">文</div><div>本地小說企劃展示與整理臺 ver1.4 · 時間線</div></div>
        <nav class="nav">
          <a href="index.html">← 返回書架</a><a href="images.html">圖片庫</a>
          <button class="btn" id="reconnectBtn" onclick="BY.reconnect()" hidden>恢復上次項目</button>
          <button class="btn" onclick="BY.connect()">重選項目</button>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section class="hero">
        <div class="eyebrow">Timeline</div>
        <h1>事件時間線</h1>
        <div class="lead">按敘事順序排列事件、狀態與對應文檔；時間名稱可以使用日期，也可以寫「第一日」「重逢後」等作品內標記。</div>
        <div class="notice" style="margin-top:12px">狀態：<span id="projectStatus">讀取中…</span></div>
        <div class="timeline-tools">
          <label>篇章篩選 <select id="timelineFilter"></select></label>
          <button class="btn" id="addTimelineBtn">＋ 新增事件</button>
        </div>
      </section>
      <section class="section"><div class="timeline-list" id="timelineList"><div class="empty">正在讀取時間線…</div></div></section>
      <p class="wrap" style="opacity:.65;padding:20px 0">程式碼 MIT · 教學 CC BY 4.0 · AI 素材另見聲明 · ver1.4</p>
    </main>
    <div class="dialog" id="timelineDialog">
      <div class="dialogbox">
        <h2 id="timelineDialogTitle">新增時間線事件</h2>
        <input type="hidden" id="timelineEventId" />
        <div class="field"><label>事件名稱</label><input id="timelineTitleInput" /></div>
        <div class="field"><label>時間標記</label><input id="timelineMoment" placeholder="例如：第一日 18:40／重逢後第七日" /></div>
        <div class="field"><label>所屬篇章</label><select id="timelineChapter"></select></div>
        <div class="field"><label>事件類型</label><input id="timelineType" placeholder="例如：主線、伏筆、感情" /></div>
        <div class="field"><label>狀態</label><input id="timelineStatus" placeholder="例如：待寫、已發生、已回收" /></div>
        <div class="field"><label>排序數字</label><input id="timelineOrder" type="number" step="1" /></div>
        <div class="field"><label>簡述</label><textarea id="timelineDescription" rows="3"></textarea></div>
        <div class="field"><label>對應文檔路徑</label><input id="timelineDocument" placeholder="content/chapter/Outline.md" /></div>
        <div class="hint">排序數字只決定先後，不必是真實日期；建議每次增加 10，方便日後插入事件。</div>
        <div class="actions"><button class="btn" onclick="Timeline.saveEvent()">保存事件</button><button class="btn" onclick="Timeline.closeEditor()">取消</button></div>
      </div>
    </div>
    <script src="js/marked.js"></script>
    <script src="js/jszip.min.js"></script>
    <script src="js/markdown-utils.js"></script>
    <script src="js/reader-navigation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/workbench.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/browse.js"></script>
    <script src="js/timeline.js"></script>
    <script>Timeline.init();</script>
  </body>
</html>
